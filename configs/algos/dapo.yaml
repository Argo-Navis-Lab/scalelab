# DAPO-style: more room upward when clipping, every token counted alike, groups with nothing
# to learn from dropped, and a soft penalty for answers that run too long.
name: dapo
estimator: grpo
clip_low: 0.2
clip_high: 0.28
normalizer: token_mean
kl_coef: 0.0
dynamic_sampling: true
overlong: soft_penalty
# The penalty starts 16 tokens before the context's end: right answers stop 18 short of it.
overlong_buffer: 16
