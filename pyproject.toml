[project]
name = "scalelab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "sqlalchemy>=2.1.5",
    "torch>=2.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scalelab"]

[project.scripts]
scalelab = "scalelab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# Strict, minus three rules that mostly flag missing types inside PyTorch, NumPy and
# parsed JSON/YAML data rather than in our own code.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false